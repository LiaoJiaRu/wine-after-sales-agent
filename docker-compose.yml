services:
  app:
    build: .
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TICKETS_DB_PATH=/app/data/wine_after_sales.db
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8501:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/_stcore/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # 仅绑定宿主机 127.0.0.1，供本地 pytest / CLI 使用
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
